[pytest]
testpaths = tests
pythonpath = .
addopts =
    --strict-markers
    -ra
    --cov=app
    --cov=routes
    --cov=services
    --cov=utils
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=75
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: full-stack HTTP tests through the Flask app
